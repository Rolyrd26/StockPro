Name: Build StockPro APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'StockProAndroid_Interfaz_Mejorada-1.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extraer proyecto StockPro
        run: |
          unzip -q StockProAndroid_Interfaz_Mejorada-1.zip -d extracted
          test -f extracted/StockProAndroid/app/build.gradle

      - name: Compilar APK
        working-directory: extracted/StockProAndroid
        run: |
          # Dar permisos de ejecución al gradlew extraído del ZIP
          chmod +x gradlew
          # Usar ./gradlew en lugar de gradle para respetar la configuración de Java del proyecto
          ./gradlew assembleDebug --no-daemon

      - name: Guardar APK compilada
        uses: actions/upload-artifact@v4
        with:
          name: StockPro-APK
          path: extracted/StockProAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
